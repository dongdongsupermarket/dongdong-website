<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>東東海报 · 一键保存</title><link rel="icon" href="../favicon.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;background:#f6f1e7;color:#1f2a24}
header{background:#23392f;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:2}h1{margin:0;font-size:20px}.t{color:#e8c66a;font-size:15px;margin-top:4px}
#save{display:block;width:calc(100% - 32px);margin:14px 16px 4px;padding:16px;border:0;border-radius:14px;background:#b3261e;color:#fff;font-size:19px;font-weight:800}
#save:disabled{opacity:.6}.tip{font-size:13px;color:#6a726c;text-align:center;margin:6px 16px 10px;line-height:1.5}
figure{position:relative;-webkit-user-select:none;user-select:none}figure img{-webkit-touch-callout:none}
.ck{display:none;position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.35);color:transparent;font-size:22px;font-weight:900;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
body.sel .ck{display:flex}figure.on .ck{background:#1f7a46;color:#fff}figure.on img{outline:4px solid #1f7a46;outline-offset:-4px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.15);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;gap:8px;z-index:5}body.sel #bar{display:flex}
#bar button{border:0;border-radius:12px;padding:13px 12px;font-size:16px;font-weight:700}#bsave{flex:1;background:#b3261e;color:#fff}#bsave:disabled{opacity:.45}#ball,#bx{background:#eee;color:#1f2a24}
.row2{display:flex;gap:8px;margin:14px 16px 4px}.row2 #save{margin:0;width:auto;flex:1}#pick{border:0;border-radius:14px;background:#23392f;color:#fff;font-size:17px;font-weight:700;padding:0 16px}
body.sel main{padding-bottom:90px}
main{padding:0 16px 30px;display:grid;gap:14px;max-width:640px;margin:auto}figure{margin:0}img{width:100%;border-radius:10px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.12)}figcaption{font-size:12px;color:#6a726c;text-align:center;margin-top:4px}</style></head>
<body><header><h1>東東超市 · 海报</h1><div class="t">到货 27/11 · 共 4 张</div></header>
<div class="row2"><button id="save">📥 全部保存（4 张）</button><button id="pick">选择</button></div>
<p class="tip" id="tip">点「全部保存」，在弹出的菜单里选「存储图像」。只要其中几张：点「选择」或长按图片，勾选后点「保存已选」。<br>请用 Safari / Chrome 打开（微信里打开不行）。</p>
<main><figure data-i="0"><img src="1.jpg?v=1795791176" alt="海报1" draggable="false"><span class="ck">✓</span><figcaption>第 1 张</figcaption></figure><figure data-i="1"><img src="2.jpg?v=1795791176" alt="海报2" draggable="false"><span class="ck">✓</span><figcaption>第 2 张</figcaption></figure><figure data-i="2"><img src="3.jpg?v=1795791176" alt="海报3" draggable="false"><span class="ck">✓</span><figcaption>第 3 张</figcaption></figure><figure data-i="3"><img src="4.jpg?v=1795791176" alt="海报4" draggable="false"><span class="ck">✓</span><figcaption>第 4 张</figcaption></figure></main><div id="bar"><button id="bx">取消</button><button id="ball">全选</button><button id="bsave" disabled>保存已选</button></div>
<script>
const N=["1.jpg?v=1795791176", "2.jpg?v=1795791176", "3.jpg?v=1795791176", "4.jpg?v=1795791176"];
const $=id=>document.getElementById(id),F=[...document.querySelectorAll("figure")],tip=$("tip");
async function saveList(idx,btn,label){btn.disabled=true;const t=btn.textContent;btn.textContent="准备中…";
 try{const fs=await Promise.all(idx.map(async i=>{const r=await fetch(N[i]);const bl=await r.blob();return new File([bl],"东东海报_"+(i+1)+".jpg",{type:"image/jpeg"})}));
  if(navigator.canShare&&navigator.canShare({files:fs}))await navigator.share({files:fs});
  else{fs.forEach(f=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();});tip.textContent="这个浏览器不支持一键存相册，已经改为下载。";}
 }catch(err){if(err.name!=="AbortError")tip.textContent="没保存成功：请用 Safari 打开再试。";}
 btn.disabled=false;btn.textContent=t;upd();}
$("save").onclick=e=>saveList(N.map((_,i)=>i),e.target);
function upd(){const n=F.filter(f=>f.classList.contains("on")).length;$("bsave").textContent=n?`保存已选（${n} 张）`:"保存已选";$("bsave").disabled=!n;$("ball").textContent=n===F.length?"全不选":"全选";}
function selMode(on){document.body.classList.toggle("sel",on);if(!on)F.forEach(f=>f.classList.remove("on"));upd();}
$("pick").onclick=()=>selMode(!document.body.classList.contains("sel"));
$("bx").onclick=()=>selMode(false);
$("ball").onclick=()=>{const all=F.every(f=>f.classList.contains("on"));F.forEach(f=>f.classList.toggle("on",!all));upd();};
$("bsave").onclick=e=>saveList(F.filter(f=>f.classList.contains("on")).map(f=>+f.dataset.i),e.target);
F.forEach(f=>{let t=0,moved=false,long=false;
 f.addEventListener("touchstart",()=>{moved=false;long=false;t=setTimeout(()=>{long=true;if(!document.body.classList.contains("sel"))selMode(true);f.classList.add("on");upd();navigator.vibrate&&navigator.vibrate(20);},450);},{passive:true});
 f.addEventListener("touchmove",()=>{moved=true;clearTimeout(t)},{passive:true});
 f.addEventListener("touchend",e=>{clearTimeout(t);if(long)e.preventDefault();});
 f.addEventListener("contextmenu",e=>e.preventDefault());
 f.addEventListener("click",()=>{if(long){long=false;return}if(document.body.classList.contains("sel")){f.classList.toggle("on");upd();}});});
</script></body></html>
